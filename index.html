<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NB Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0a0a0c;
  --bg2:         #111114;
  --bg3:         #18181d;
  --bg4:         #1e1e25;
  --bg5:         #25252f;
  --border:      rgba(255,255,255,0.06);
  --border2:     rgba(255,255,255,0.1);
  --blue:        #3b82f6;
  --blue2:       #2563eb;
  --blue-glow:   rgba(59,130,246,0.2);
  --blue-faint:  rgba(59,130,246,0.08);
  --text:        #e8e8f0;
  --text2:       rgba(232,232,240,0.55);
  --text3:       rgba(232,232,240,0.25);
  --red:         #ef4444;
  --red-faint:   rgba(239,68,68,0.1);
  --radius:      10px;
  --radius2:     16px;
  --sidebar:     240px;
  --mono:        'Geist Mono', monospace;
  --sans:        'Geist', sans-serif;
  --ease:        cubic-bezier(.4,0,.2,1);
}

html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }

.app { display: flex; height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-top {
  padding: 14px 12px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 4px;
}
.brand-dot {
  width: 22px; height: 22px;
  background: var(--blue);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px var(--blue-glow);
  flex-shrink: 0;
}
.brand-dot svg { width: 12px; height: 12px; }
.brand-name { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }

.new-chat-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: var(--radius);
  background: var(--blue);
  border: none;
  cursor: pointer;
  color: #fff;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  width: 100%;
  transition: background 0.15s;
  letter-spacing: -0.1px;
}
.new-chat-btn:hover { background: var(--blue2); }
.new-chat-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.sidebar-section-label {
  font-size: 10px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 12px 4px;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 8px;
}
.chat-list::-webkit-scrollbar { width: 3px; }
.chat-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.chat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
}
.chat-item:hover { background: var(--bg4); }
.chat-item.active { background: var(--blue-faint); }
.chat-item.active .chat-item-title { color: var(--text); }

.chat-item-icon {
  width: 14px; height: 14px;
  color: var(--text3);
  flex-shrink: 0;
}
.chat-item.active .chat-item-icon { color: var(--blue); }

.chat-item-title {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  letter-spacing: -0.1px;
}

.chat-item-delete {
  width: 20px; height: 20px;
  border-radius: 5px;
  background: transparent;
  border: none;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  flex-shrink: 0;
  transition: background 0.1s, color 0.1s;
}
.chat-item:hover .chat-item-delete { display: flex; }
.chat-item-delete:hover { background: var(--red-faint); color: var(--red); }
.chat-item-delete svg { width: 11px; height: 11px; }

.chat-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 32px 16px;
  color: var(--text3);
  font-size: 12px;
  text-align: center;
}
.chat-empty svg { width: 28px; height: 28px; opacity: 0.3; }

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-user-avatar {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.sidebar-user-info { flex: 1; overflow: hidden; }
.sidebar-user-name { font-size: 12px; font-weight: 500; letter-spacing: -0.1px; }
.sidebar-user-sub { font-size: 10.5px; color: var(--text2); }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  min-height: 52px;
  gap: 12px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}

.conv-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.1px;
}

/* Model selector */

/* ── CHAT AREA ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── WELCOME ── */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 40px 24px;
  animation: fadeUp 0.4s var(--ease);
}
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

.welcome-icon {
  width: 46px; height: 46px;
  background: var(--blue);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 32px var(--blue-glow);
  margin-bottom: 10px;
}
.welcome-icon svg { width: 22px; height: 22px; }
.welcome-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.welcome-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

/* ── MESSAGES ── */
.messages { padding: 16px 0 8px; display: flex; flex-direction: column; gap: 2px; }

.msg-row {
  padding: 2px 20px;
  animation: fadeUp 0.25s var(--ease);
}

.msg-content {
  max-width: 740px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  gap: 12px;
}
.msg-row.user .msg-content { justify-content: flex-end; }

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-avatar.ai   { background: var(--blue); color: #fff; box-shadow: 0 0 10px var(--blue-glow); }
.msg-avatar.user { background: var(--bg5); color: var(--text2); border: 1px solid var(--border2); }

.msg-body { flex: 1; min-width: 0; }
.msg-row.user .msg-body { flex: 0 1 auto; max-width: 600px; }

.msg-name {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text3);
  margin-bottom: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.msg-text {
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text);
}

.msg-row.user .msg-text {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: 12px 12px 4px 12px;
  padding: 10px 14px;
}

.msg-text p { margin-bottom: 8px; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text pre {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 10px 0;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
}
.msg-text code {
  font-family: var(--mono);
  font-size: 12px;
  color: #93c5fd;
  background: var(--bg4);
  padding: 1px 5px;
  border-radius: 4px;
}
.msg-text pre code { background: transparent; padding: 0; color: var(--text); }
.msg-text strong { font-weight: 600; }
.msg-text em { font-style: italic; color: var(--text2); }
.msg-text ul, .msg-text ol { padding-left: 20px; margin: 6px 0; }
.msg-text li { margin: 3px 0; line-height: 1.65; }
.msg-text h1 { font-size: 18px; font-weight: 600; margin: 12px 0 6px; letter-spacing: -0.4px; }
.msg-text h2 { font-size: 15px; font-weight: 600; margin: 10px 0 5px; letter-spacing: -0.3px; }
.msg-text h3 { font-size: 13.5px; font-weight: 600; margin: 8px 0 4px; letter-spacing: -0.2px; }
.msg-text blockquote { border-left: 2px solid var(--blue); padding-left: 12px; color: var(--text2); margin: 8px 0; }
.msg-text a { color: var(--blue); text-decoration: none; }
.msg-text a:hover { text-decoration: underline; }
.msg-text hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.msg-text table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.msg-text th, .msg-text td { padding: 7px 12px; border: 1px solid var(--border2); text-align: left; }
.msg-text th { background: var(--bg4); font-weight: 600; }

.typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
.typing span {
  width: 6px; height: 6px;
  background: var(--blue);
  border-radius: 50%;
  animation: blink 1.3s ease infinite;
  opacity: 0.3;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

.msg-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.15s;
}
.msg-row:hover .msg-actions { opacity: 1; }
.msg-action-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px;
  border-radius: 5px;
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  color: var(--text3);
  font-family: var(--sans);
  font-size: 11px;
  transition: all 0.1s;
}
.msg-action-btn:hover { background: var(--bg4); border-color: var(--border); color: var(--text2); }
.msg-action-btn svg { width: 11px; height: 11px; }

/* ── INPUT ── */
.input-wrapper { padding: 12px 20px 16px; }
.input-container {
  max-width: 740px;
  margin: 0 auto;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius2);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-container:focus-within {
  border-color: rgba(59,130,246,0.4);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.06);
}

.textarea-wrap { padding: 14px 16px 0; }
textarea {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--sans);
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.6;
  min-height: 22px;
  max-height: 180px;
  overflow-y: auto;
  letter-spacing: -0.1px;
}
textarea::-webkit-scrollbar { width: 3px; }
textarea::placeholder { color: var(--text3); }

.input-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px 10px;
}
.input-hint {
  font-size: 11px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 4px;
}
.input-hint kbd {
  background: var(--bg5);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text2);
}

.send-btn {
  width: 32px; height: 32px;
  border-radius: 9px;
  border: none;
  background: var(--blue);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s, opacity 0.15s;
  opacity: 0.3;
  flex-shrink: 0;
}
.send-btn.ready { opacity: 1; }
.send-btn.ready:hover { background: var(--blue2); }
.send-btn.ready:active { transform: scale(0.95); }
.send-btn.stop {
  opacity: 1;
  background: var(--bg5);
  border: 1px solid var(--border2);
  color: var(--text2);
}
.send-btn.stop:hover { background: var(--red-faint); border-color: var(--red); color: var(--red); }
.send-btn svg { width: 14px; height: 14px; }

.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SETTINGS MODAL ── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.2s var(--ease);
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius2);
  width: 100%;
  max-width: 440px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.modal-close {
  background: transparent;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 4px;
  transition: color 0.1s;
}
.modal-close:hover { color: var(--text); }

.field { margin-bottom: 16px; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.field-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.field-input:focus { border-color: var(--blue); }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}
.btn {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
.btn-ghost:hover { background: var(--bg4); }
.btn-primary { background: var(--blue); border: none; color: #fff; }
.btn-primary:hover { background: var(--blue2); }

.settings-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius);
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  color: var(--text2);
  font-family: var(--sans);
  font-size: 12px;
  width: 100%;
  transition: background 0.12s;
}
.settings-btn:hover { background: var(--bg4); color: var(--text); }
.settings-btn svg { width: 14px; height: 14px; opacity: 0.7; }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-dot">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span class="brand-name">NB Chat</span>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Novo chat
      </button>
    </div>

    <div class="sidebar-section-label">Conversas</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom" style="flex-direction: column; gap: 12px; align-items: stretch;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="sidebar-user-avatar">NB</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Natan</div>
          <div class="sidebar-user-sub">Salvo localmente</div>
        </div>
      </div>
      <button class="settings-btn" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Configurações de IA
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--text3);flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="conv-title" id="convTitle">Novo chat</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:#18181d;border:1px solid rgba(255,255,255,0.06);font-size:12px;font-weight:500;color:rgba(232,232,240,0.55);">
        <span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0;"></span>
        GPT-4o
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="welcome-title" id="welcomeTitle">Olá, Natan 👋</div>
        <div class="welcome-sub">Comece digitando uma mensagem abaixo</div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <!-- INPUT -->
    <div class="input-wrapper">
      <div class="input-container">
        <div class="textarea-wrap">
          <textarea
            id="userInput"
            placeholder="Escreva sua mensagem..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this); toggleSendBtn()"
          ></textarea>
        </div>
        <div class="input-footer">
          <div class="input-hint">
            <kbd>Enter</kbd> enviar &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> nova linha
          </div>
          <button class="send-btn" id="sendBtn" onclick="handleSendClick()">
            <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Configurações de IA</h3>
      <button class="modal-close" onclick="closeSettings()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    
    <div class="field">
      <label class="field-label">API Endpoint</label>
      <input type="text" id="setApiUrl" class="field-input" placeholder="https://...">
    </div>
    
    <div class="field">
      <label class="field-label">API Key</label>
      <input type="password" id="setApiKey" class="field-input" placeholder="foundry_sk_...">
    </div>
    
    <div class="field">
      <label class="field-label">Modelo</label>
      <input type="text" id="setApiModel" class="field-input" placeholder="gpt-4o">
    </div>

    <div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="setApiStream" style="width:16px; height:16px; cursor:pointer;">
      <label for="setApiStream" class="field-label" style="margin-bottom:0; cursor:pointer;">Habilitar Streaming (Resposta em tempo real)</label>
    </div>

    <div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="setApiProxy" style="width:16px; height:16px; cursor:pointer;">
      <label for="setApiProxy" class="field-label" style="margin-bottom:0; cursor:pointer;">Burlar CORS (Usar Proxy)</label>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeSettings()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSettings()">Salvar Alterações</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════
   CONFIG
═══════════════════════════════ */
let API_URL = localStorage.getItem('nb_api_url') || "https://automa-o-business.vercel.app/api/v1/chat/completions";
let API_KEY = localStorage.getItem('nb_api_key') || "foundry_sk_bzrixgfs6li";
let MODEL   = localStorage.getItem('nb_api_model') || 'gpt-4o';
let USE_STREAM = localStorage.getItem('nb_api_stream') === 'true';
let USE_PROXY  = localStorage.getItem('nb_api_proxy') === 'true';

/* ═══════════════════════════════
   DB — localStorage como banco SQL local
   Tabelas:
     nb_convs           → lista de conversas [{id, title, model, createdAt, updatedAt}]
     nb_msgs_{convId}   → mensagens [{role, content, ts}]
═══════════════════════════════ */
const DB = {
  getConvs() {
    try { return JSON.parse(localStorage.getItem('nb_convs') || '[]'); } catch { return []; }
  },
  saveConvs(list) {
    localStorage.setItem('nb_convs', JSON.stringify(list));
  },
  getMsgs(id) {
    try { return JSON.parse(localStorage.getItem('nb_msgs_' + id) || '[]'); } catch { return []; }
  },
  saveMsgs(id, msgs) {
    localStorage.setItem('nb_msgs_' + id, JSON.stringify(msgs));
  },
  createConv(title, model) {
    const id = 'cv_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const conv = { id, title, model, createdAt: Date.now(), updatedAt: Date.now() };
    const list = this.getConvs();
    list.unshift(conv);
    this.saveConvs(list);
    return conv;
  },
  updateConvTitle(id, title) {
    const list = this.getConvs();
    const i = list.findIndex(c => c.id === id);
    if (i !== -1) { list[i].title = title; list[i].updatedAt = Date.now(); this.saveConvs(list); }
  },
  touchConv(id) {
    const list = this.getConvs();
    const i = list.findIndex(c => c.id === id);
    if (i !== -1) { list[i].updatedAt = Date.now(); this.saveConvs(list); }
  },
  deleteConv(id) {
    this.saveConvs(this.getConvs().filter(c => c.id !== id));
    localStorage.removeItem('nb_msgs_' + id);
  },
  appendMsg(convId, role, content) {
    const msgs = this.getMsgs(convId);
    msgs.push({ role, content, ts: Date.now() });
    this.saveMsgs(convId, msgs);
    this.touchConv(convId);
  }
};

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let currentConvId = null;
let isLoading     = false;
let abortCtrl     = null;
let titleGenerated = false;

/* ═══════════════════════════════
   BOOT
═══════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  setGreeting();
  renderSidebar();
  
  // Update model badge from config
  const modelBadge = document.querySelector('.topbar div[style*="background:#18181d"]');
  if (modelBadge) {
    modelBadge.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0;"></span> ${MODEL}`;
  }
});

function setGreeting() {
  const h = new Date().getHours();
  const g = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  document.getElementById('welcomeTitle').textContent = g + ', Natan 👋';
}

/* ═══════════════════════════════
   SIDEBAR
═══════════════════════════════ */
function renderSidebar() {
  const list = DB.getConvs();
  const el = document.getElementById('chatList');
  if (!list.length) {
    el.innerHTML = '<div class="chat-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Nenhum chat ainda</div>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="chat-item ${c.id === currentConvId ? 'active' : ''}" onclick="loadConv('${c.id}')">
      <svg class="chat-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="chat-item-title">${esc(c.title)}</span>
      <button class="chat-item-delete" onclick="deleteConv(event,'${c.id}')" title="Deletar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>
      </button>
    </div>`).join('');
}

/* ═══════════════════════════════
   CONV ACTIONS
═══════════════════════════════ */
function newChat() {
  currentConvId = null;
  titleGenerated = false;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('convTitle').textContent = 'Novo chat';
  document.getElementById('userInput').value = '';
  autoResize(document.getElementById('userInput'));
  toggleSendBtn();
  renderSidebar();
}

function loadConv(id) {
  currentConvId = id;
  titleGenerated = true;
  const conv = DB.getConvs().find(c => c.id === id);
  if (!conv) return;

  document.getElementById('convTitle').textContent = conv.title;
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('messages').innerHTML = '';

  DB.getMsgs(id).forEach(m => renderMsg(m.role, m.content, false));
  renderSidebar();
  scrollToBottom(false);
}

function deleteConv(e, id) {
  e.stopPropagation();
  DB.deleteConv(id);
  if (currentConvId === id) newChat();
  else renderSidebar();
  toast('Chat deletado');
}

/* ═══════════════════════════════
   SETTINGS
═══════════════════════════════ */
function openSettings() {
  document.getElementById('setApiUrl').value = API_URL;
  document.getElementById('setApiKey').value = API_KEY;
  document.getElementById('setApiModel').value = MODEL;
  document.getElementById('setApiStream').checked = USE_STREAM;
  document.getElementById('setApiProxy').checked = USE_PROXY;
  document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}

function saveSettings() {
  const url = document.getElementById('setApiUrl').value.trim();
  const key = document.getElementById('setApiKey').value.trim();
  const mod = document.getElementById('setApiModel').value.trim();
  const str = document.getElementById('setApiStream').checked;
  const prx = document.getElementById('setApiProxy').checked;
  
  if (!url || !key || !mod) {
    toast('Preencha todos os campos');
    return;
  }
  
  API_URL = url;
  API_KEY = key;
  MODEL = mod;
  USE_STREAM = str;
  USE_PROXY = prx;
  
  localStorage.setItem('nb_api_url', url);
  localStorage.setItem('nb_api_key', key);
  localStorage.setItem('nb_api_model', mod);
  localStorage.setItem('nb_api_stream', str);
  localStorage.setItem('nb_api_proxy', prx);
  
  closeSettings();
  toast('Configurações salvas!');
  
  // Update UI if needed
  const modelBadge = document.querySelector('.topbar div[style*="background:#18181d"]');
  if (modelBadge) {
    modelBadge.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0;"></span> ${MODEL}`;
  }
}

/* ═══════════════════════════════
   TEXTAREA
═══════════════════════════════ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function toggleSendBtn() {
  const has = document.getElementById('userInput').value.trim().length > 0;
  if (!isLoading) document.getElementById('sendBtn').classList.toggle('ready', has);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isLoading && document.getElementById('userInput').value.trim()) sendMessage();
  }
}

function handleSendClick() {
  if (isLoading) { if (abortCtrl) abortCtrl.abort(); return; }
  if (document.getElementById('userInput').value.trim()) sendMessage();
}

/* ═══════════════════════════════
   RENDER MSG
═══════════════════════════════ */
function renderMsg(role, content, animate = true) {
  document.getElementById('welcome').style.display = 'none';
  const msgs = document.getElementById('messages');
  const isAI = role === 'assistant';
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  if (!animate) row.style.animation = 'none';

  row.innerHTML = `
    <div class="msg-content">
      ${isAI ? '<div class="msg-avatar ai">✦</div>' : ''}
      <div class="msg-body">
        <div class="msg-name">${isAI ? 'IA' : 'Você'}</div>
        <div class="msg-text">${isAI ? md(content) : esc(content)}</div>
        ${isAI ? `<div class="msg-actions">
          <button class="msg-action-btn" data-text="${escAttr(content)}" onclick="copyMsg(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copiar
          </button>
        </div>` : ''}
      </div>
      ${!isAI ? '<div class="msg-avatar user">NB</div>' : ''}
    </div>`;

  msgs.appendChild(row);
  scrollToBottom();
  return row;
}

function appendStreamBubble() {
  document.getElementById('welcome').style.display = 'none';
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `
    <div class="msg-content">
      <div class="msg-avatar ai">✦</div>
      <div class="msg-body">
        <div class="msg-name">IA</div>
        <div class="msg-text stream-text"><div class="typing"><span></span><span></span><span></span></div></div>
        <div class="msg-actions" style="opacity:0">
          <button class="msg-action-btn" data-text="" onclick="copyMsg(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copiar
          </button>
        </div>
      </div>
    </div>`;
  msgs.appendChild(row);
  scrollToBottom();
  return row;
}

/* ═══════════════════════════════
   SEND
═══════════════════════════════ */
async function sendMessage() {
  const inp = document.getElementById('userInput');
  const content = inp.value.trim();
  if (!content || isLoading) return;

  // Cria conversa se for nova
  if (!currentConvId) {
    const shortTitle = content.length > 40 ? content.slice(0, 40) + '…' : content;
    const conv = DB.createConv(shortTitle, MODEL);
    currentConvId = conv.id;
    titleGenerated = false;
    document.getElementById('convTitle').textContent = conv.title;
    renderSidebar();
  }

  isLoading = true;
  inp.value = '';
  autoResize(inp);

  const btn = document.getElementById('sendBtn');
  btn.classList.remove('ready');
  btn.classList.add('stop');
  document.getElementById('sendIcon').innerHTML = '<rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/>';

  DB.appendMsg(currentConvId, 'user', content);
  renderMsg('user', content);

  const history = DB.getMsgs(currentConvId).map(m => ({ role: m.role, content: m.content }));

  const streamRow = appendStreamBubble();
  const streamEl  = streamRow.querySelector('.stream-text');
  let fullText = '';

  try {
    const authHeader = API_KEY.startsWith('Bearer ') ? API_KEY : 'Bearer ' + API_KEY;
    
    // Use Proxy if enabled
    const finalUrl = USE_PROXY ? 'https://corsproxy.io/?' + encodeURIComponent(API_URL) : API_URL;

    abortCtrl = new AbortController();
    const res = await fetch(finalUrl, {
      method: 'POST',
      headers: { 
        'Authorization': authHeader, 
        'Content-Type': 'application/json'
      },
      signal: abortCtrl.signal,
      body: JSON.stringify({ 
        model: MODEL, 
        messages: history, 
        stream: USE_STREAM 
      })
    });

    if (!res.ok) {
      const errorText = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status} ${res.statusText}${errorText ? ': ' + errorText.slice(0,100) : ''}`);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    streamEl.innerHTML = '';

    // Check if it's actually a stream
    const contentType = res.headers.get('Content-Type') || '';
    const isStream = contentType.includes('event-stream');

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      if (!isStream && done) {
        // Not a stream, try to parse as full JSON at the end
        try {
          const data = JSON.parse(buffer);
          fullText = data.choices?.[0]?.message?.content || '';
          if (fullText) streamEl.innerHTML = md(fullText);
        } catch (e) { console.error("Erro ao parsear JSON não-stream:", e); }
        break;
      }

      if (isStream) {
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const cleanLine = line.trim();
          if (!cleanLine || !cleanLine.startsWith('data: ')) continue;
          
          const raw = cleanLine.slice(6).trim();
          if (raw === '[DONE]') continue;
          
          try {
            const json = JSON.parse(raw);
            const delta = json.choices?.[0]?.delta?.content || json.choices?.[0]?.text || '';
            if (delta) { 
              fullText += delta; 
              streamEl.innerHTML = md(fullText); 
              scrollToBottom(false); 
            }
          } catch (e) {
            console.warn("Erro ao parsear linha de stream:", e, cleanLine);
          }
        }
      }
    }

    // Se acabou o loop e não temos texto, mas temos buffer
    if (!fullText && buffer.trim()) {
       try {
          const data = JSON.parse(buffer);
          fullText = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || '';
          if (fullText) streamEl.innerHTML = md(fullText);
       } catch {}
    }

  } catch (err) {
    console.error("Erro na requisição:", err);
    if (err.name === 'AbortError') {
      if (!fullText) streamRow.remove();
    } else {
      // Fallback sem stream
      try {
        const r2 = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: MODEL, messages: history })
        });
        
        if (!r2.ok) {
           const errorBody = await r2.text().catch(() => "");
           throw new Error(`Erro API (${r2.status}): ${errorBody.slice(0, 50) || r2.statusText}`);
        }
        
        const data = await r2.json();
        fullText = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || '';
        if (fullText) streamEl.innerHTML = md(fullText);
        else throw new Error('Resposta vazia da API');
      } catch (e2) {
        streamEl.innerHTML = '<div style="color:#ef4444; background:rgba(239,68,68,0.1); padding:10px; border-radius:8px; margin-top:5px; font-size:12px;">' + 
                             '<strong>⚠️ Erro de Conexão</strong><br>' + esc(e2.message) + '</div>';
        console.error("Erro no fallback:", e2);
      }
    }
  }

  // Salva resposta da IA
  if (fullText) {
    DB.appendMsg(currentConvId, 'assistant', fullText);
    const actionsEl = streamRow.querySelector('.msg-actions');
    const copyBtn   = streamRow.querySelector('.msg-action-btn');
    if (actionsEl) actionsEl.style.opacity = '';
    if (copyBtn)   copyBtn.dataset.text = fullText;

    // Auto-titula conversa com IA (apenas 1x)
    if (!titleGenerated) {
      titleGenerated = true;
      autoTitle(content, fullText);
    }
  }

  isLoading = false;
  abortCtrl = null;
  btn.classList.remove('stop');
  document.getElementById('sendIcon').innerHTML = '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>';
  toggleSendBtn();
  renderSidebar();
}

/* ═══════════════════════════════
   AUTO-TÍTULO via IA
═══════════════════════════════ */
async function autoTitle(userMsg, aiReply) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{
          role: 'user',
          content: 'Crie um título curto em PT-BR (máx 5 palavras, sem aspas ou pontuação no final) para essa conversa:\nUsuário: ' + userMsg + '\nIA: ' + aiReply.slice(0, 200)
        }],
        max_tokens: 25
      })
    });
    const data = await res.json();
    const title = (data.choices?.[0]?.message?.content || '').trim().replace(/^["']|["']$/g, '');
    if (title && title.length < 60 && currentConvId) {
      DB.updateConvTitle(currentConvId, title);
      document.getElementById('convTitle').textContent = title;
      renderSidebar();
    }
  } catch {}
}

/* ═══════════════════════════════
   UTILS
═══════════════════════════════ */
function scrollToBottom(smooth = true) {
  const ca = document.getElementById('chatArea');
  ca.scrollTo({ top: ca.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function md(raw) {
  // Preserve code blocks first
  const codeBlocks = [];
  let s = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code>${esc(code.trim())}</code></pre>`);
    return '\x00CB' + (codeBlocks.length - 1) + '\x00';
  });

  // Inline code
  const inlineCodes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, code) => {
    inlineCodes.push('<code>' + esc(code) + '</code>');
    return '\x00IC' + (inlineCodes.length - 1) + '\x00';
  });

  s = esc(s);

  // Headers
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // HR
  s = s.replace(/^---$/gm, '<hr>');
  // Lists
  s = s.replace(/((?:^[*-] .+\n?)+)/gm, m =>
    '<ul>' + m.trim().split('\n').map(l => '<li>' + l.replace(/^[*-] /, '') + '</li>').join('') + '</ul>');
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, m =>
    '<ol>' + m.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>');
  // Links
  s = s.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Paragraphs
  const parts = s.split(/\n{2,}/);
  s = parts.map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<(h[1-3]|pre|ul|ol|blockquote|hr)/.test(b)) return b;
    return '<p>' + b.replace(/\n/g, '<br>') + '</p>';
  }).join('');

  // Restore code
  s = s.replace(/\x00CB(\d+)\x00/g, (_, i) => codeBlocks[+i]);
  s = s.replace(/\x00IC(\d+)\x00/g, (_, i) => inlineCodes[+i]);
  return s;
}

function copyMsg(btn) {
  navigator.clipboard.writeText(btn.dataset.text)
    .then(() => toast('Copiado!'))
    .catch(() => toast('Erro ao copiar'));
}

function toast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
