<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NB Chat — IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:      #0d0d0f;
    --bg-sidebar:   #111115;
    --bg-panel:     #16161c;
    --bg-input:     #1c1c24;
    --bg-hover:     #1f1f2a;
    --bg-msg-ai:    #181820;
    --border:       rgba(255,255,255,0.07);
    --border-glow:  rgba(59,130,246,0.35);
    --blue:         #3b82f6;
    --blue-bright:  #60a5fa;
    --blue-dim:     rgba(59,130,246,0.15);
    --white:        #f0f0f5;
    --white-dim:    rgba(240,240,245,0.6);
    --white-faint:  rgba(240,240,245,0.2);
    --accent:       #2563eb;
    --scrollbar:    rgba(59,130,246,0.2);
    --font-main:    'Sora', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
    --radius-sm:    8px;
    --radius-md:    14px;
    --radius-lg:    20px;
    --sidebar-w:    56px;
    --transition:   0.18s ease;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg-base); font-family: var(--font-main); color: var(--white); }

  /* ─── LAYOUT ─── */
  .app { display: flex; height: 100vh; width: 100vw; }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
    z-index: 10;
  }
  .sidebar-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--white-dim);
    transition: background var(--transition), color var(--transition);
    border: none; background: transparent;
    position: relative;
  }
  .sidebar-btn:hover { background: var(--bg-hover); color: var(--white); }
  .sidebar-btn.active { background: var(--blue-dim); color: var(--blue-bright); }
  .sidebar-btn svg { width: 18px; height: 18px; }
  .sidebar-btn.new-chat {
    background: var(--blue);
    color: #fff;
    margin-bottom: 8px;
  }
  .sidebar-btn.new-chat:hover { background: var(--accent); }

  .sidebar-spacer { flex: 1; }

  .avatar-btn {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
    cursor: pointer; margin-top: 4px;
    border: 2px solid var(--border);
    transition: border-color var(--transition);
  }
  .avatar-btn:hover { border-color: var(--blue); }

  /* ─── MAIN ─── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  /* ─── TOPBAR ─── */
  .topbar {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    min-height: 48px;
    background: var(--bg-base);
  }
  .model-selector {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-panel);
    cursor: pointer;
    font-size: 12px; color: var(--white-dim);
    transition: border-color var(--transition);
    user-select: none;
  }
  .model-selector:hover { border-color: var(--border-glow); color: var(--white); }
  .model-selector .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue-bright);
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .pro-btn {
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--blue);
    background: var(--blue-dim);
    color: var(--blue-bright);
    font-family: var(--font-main);
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: background var(--transition);
  }
  .pro-btn:hover { background: rgba(59,130,246,0.25); }

  /* ─── CHAT AREA ─── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

  /* ─── WELCOME ─── */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
    animation: fadeUp 0.5s ease forwards;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

  .welcome-title {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 500;
    letter-spacing: -0.5px;
  }
  .welcome-logo {
    width: 36px; height: 36px;
    background: var(--blue);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 0 24px rgba(59,130,246,0.5);
  }
  .welcome-logo::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid rgba(59,130,246,0.4);
    animation: ring 3s linear infinite;
  }
  @keyframes ring { from{transform:scale(1);opacity:0.6} to{transform:scale(1.4);opacity:0} }

  /* ─── INPUT BOX ─── */
  .input-wrapper {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: linear-gradient(to top, var(--bg-base) 70%, transparent);
  }
  .input-box {
    width: 100%;
    max-width: 720px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px 10px;
    transition: border-color 0.2s;
    position: relative;
  }
  .input-box:focus-within { border-color: var(--border-glow); box-shadow: 0 0 0 3px rgba(59,130,246,0.08); }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--font-main);
    font-size: 14px;
    color: var(--white);
    line-height: 1.6;
    min-height: 24px;
    max-height: 200px;
    overflow-y: auto;
  }
  textarea::placeholder { color: var(--white-faint); }
  textarea::-webkit-scrollbar { width: 3px; }
  textarea::-webkit-scrollbar-thumb { background: var(--scrollbar); }

  .input-actions {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px;
  }
  .input-left { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--white-faint);
    transition: background var(--transition), color var(--transition);
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--white-dim); }
  .icon-btn svg { width: 16px; height: 16px; }

  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), transform var(--transition), opacity var(--transition);
    opacity: 0.4;
  }
  .send-btn.active { opacity: 1; }
  .send-btn.active:hover { background: var(--accent); transform: scale(1.05); }
  .send-btn svg { width: 15px; height: 15px; }

  /* ─── QUICK CHIPS ─── */
  .quick-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    max-width: 720px;
    width: 100%;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    font-size: 12px; color: var(--white-dim);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .chip:hover { border-color: var(--border-glow); color: var(--white); background: var(--bg-hover); }
  .chip svg { width: 13px; height: 13px; opacity: 0.7; }

  /* ─── MESSAGES ─── */
  .messages { padding: 20px 0; display: flex; flex-direction: column; gap: 0; }

  .msg-row {
    display: flex;
    padding: 4px 20px;
    animation: fadeUp 0.3s ease;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .msg-bubble {
    max-width: 680px;
    width: 100%;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    line-height: 1.7;
  }
  .msg-row.user .msg-bubble {
    background: var(--blue-dim);
    border: 1px solid rgba(59,130,246,0.2);
    max-width: 520px;
    color: var(--white);
  }
  .msg-row.assistant .msg-bubble {
    background: transparent;
    color: var(--white);
    padding-left: 0;
  }

  .msg-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .msg-icon {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }
  .msg-icon.ai { background: var(--blue); color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.4); }
  .msg-icon.user { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; }
  .msg-label { font-size: 12px; font-weight: 500; color: var(--white-dim); }

  /* code blocks */
  .msg-bubble pre {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .msg-bubble code { font-family: var(--font-mono); font-size: 12.5px; color: var(--blue-bright); }
  .msg-bubble p { margin-bottom: 6px; }
  .msg-bubble p:last-child { margin-bottom: 0; }

  /* ─── TYPING INDICATOR ─── */
  .typing-dots {
    display: inline-flex; gap: 4px; align-items: center;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    background: var(--blue);
    border-radius: 50%;
    animation: bounce 1.2s ease infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* ─── SCROLLBOTTOM ─── */
  .scroll-btn {
    position: absolute;
    bottom: 130px; right: 24px;
    width: 34px; height: 34px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    color: var(--white-dim);
    transition: all var(--transition);
    z-index: 5;
  }
  .scroll-btn.visible { display: flex; }
  .scroll-btn:hover { background: var(--bg-hover); color: var(--white); }
  .scroll-btn svg { width: 15px; height: 15px; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 12px; color: var(--blue-bright);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  /* ─── DIVIDER ─── */
  .conv-divider {
    text-align: center;
    font-size: 11px;
    color: var(--white-faint);
    padding: 10px 0;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <button class="sidebar-btn new-chat" title="Novo chat" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <button class="sidebar-btn active" title="Chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="sidebar-btn" title="Buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
    <button class="sidebar-btn" title="Agentes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="sidebar-btn" title="Histórico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
    </button>
    <button class="sidebar-btn" title="Apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="sidebar-btn" title="Código">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>

    <div class="sidebar-spacer"></div>

    <button class="sidebar-btn" title="Download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <div class="avatar-btn" title="Perfil">NB</div>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="model-selector">
        <span class="dot"></span>
        <span>GPT-4o</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <button class="pro-btn">Obter Pro</button>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">

      <!-- WELCOME -->
      <div class="welcome" id="welcome">
        <div class="welcome-title">
          <div class="welcome-logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <span id="greetingText">Olá, Natan</span>
        </div>
      </div>

      <!-- MESSAGES -->
      <div class="messages" id="messages"></div>
    </div>

    <!-- SCROLL BTN -->
    <button class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <!-- INPUT -->
    <div class="input-wrapper">
      <div class="input-box" id="inputBox">
        <textarea
          id="userInput"
          placeholder="Como posso ajudar você hoje?"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this); toggleSendBtn()"
        ></textarea>
        <div class="input-actions">
          <div class="input-left">
            <button class="icon-btn" title="Anexar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="icon-btn" title="Microfone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
          </div>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

      <!-- CHIPS -->
      <div class="quick-chips" id="quickChips">
        <div class="chip" onclick="useChip('Escreva um código para ')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Código
        </div>
        <div class="chip" onclick="useChip('Explique como funciona ')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Aprender
        </div>
        <div class="chip" onclick="useChip('Crie para mim ')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Criar
        </div>
        <div class="chip" onclick="useChip('Escreva para mim ')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Escrever
        </div>
        <div class="chip" onclick="useChip('Analise e me ajude com ')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Analisar
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const API_URL = "https://automa-o-business.vercel.app/api/v1/chat/completions";
const API_KEY = "foundry_sk_bzrixgfs6li";
const MODEL   = "gpt-4o-mini";

let conversationHistory = [];
let isLoading = false;

// ── GREETING ─────────────────────────────────────────────
function setGreeting() {
  const h = new Date().getHours();
  const g = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  document.getElementById("greetingText").textContent = `${g}, Natan`;
}
setGreeting();

// ── TEXTAREA AUTO RESIZE ──────────────────────────────────
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 200) + "px";
}

function toggleSendBtn() {
  const v = document.getElementById("userInput").value.trim().length > 0;
  document.getElementById("sendBtn").classList.toggle("active", v);
}

// ── CHIP SHORTCUT ─────────────────────────────────────────
function useChip(text) {
  const inp = document.getElementById("userInput");
  inp.value = text;
  inp.focus();
  autoResize(inp);
  toggleSendBtn();
}

// ── KEY HANDLER ───────────────────────────────────────────
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!isLoading && document.getElementById("userInput").value.trim()) sendMessage();
  }
}

// ── SCROLL ────────────────────────────────────────────────
function scrollToBottom(smooth = true) {
  const ca = document.getElementById("chatArea");
  ca.scrollTo({ top: ca.scrollHeight, behavior: smooth ? "smooth" : "instant" });
}

document.getElementById("chatArea").addEventListener("scroll", () => {
  const ca = document.getElementById("chatArea");
  const near = ca.scrollHeight - ca.scrollTop - ca.clientHeight < 120;
  document.getElementById("scrollBtn").classList.toggle("visible", !near);
});

// ── NEW CHAT ──────────────────────────────────────────────
function newChat() {
  conversationHistory = [];
  document.getElementById("messages").innerHTML = "";
  document.getElementById("welcome").style.display = "flex";
  document.getElementById("quickChips").style.display = "flex";
  document.getElementById("userInput").value = "";
  autoResize(document.getElementById("userInput"));
  toggleSendBtn();
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg, duration = 2500) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), duration);
}

// ── APPEND MESSAGE ────────────────────────────────────────
function appendMessage(role, content, streaming = false) {
  const msgs = document.getElementById("messages");

  // Hide welcome on first msg
  document.getElementById("welcome").style.display = "none";
  document.getElementById("quickChips").style.display = "flex";

  const row = document.createElement("div");
  row.className = `msg-row ${role}`;

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";

  if (role === "assistant") {
    const header = document.createElement("div");
    header.className = "msg-header";
    header.innerHTML = `
      <div class="msg-icon ai">✦</div>
      <span class="msg-label">IA</span>
    `;
    bubble.appendChild(header);
  }

  const text = document.createElement("div");
  text.className = "msg-text";
  if (streaming) {
    text.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  } else {
    text.innerHTML = formatContent(content);
  }

  bubble.appendChild(text);
  row.appendChild(bubble);
  msgs.appendChild(row);
  scrollToBottom();

  return text;
}

// ── FORMAT CONTENT ────────────────────────────────────────
function formatContent(text) {
  // Escape HTML
  let out = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // Code blocks
  out = out.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${code.trim()}</code></pre>`;
  });

  // Inline code
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Paragraphs
  out = out.split('\n\n').map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');

  return out || `<p>${text}</p>`;
}

// ── SEND MESSAGE ──────────────────────────────────────────
async function sendMessage() {
  const inp = document.getElementById("userInput");
  const content = inp.value.trim();
  if (!content || isLoading) return;

  isLoading = true;
  inp.value = "";
  autoResize(inp);
  toggleSendBtn();

  // User bubble
  appendMessage("user", content);

  // Add to history
  conversationHistory.push({ role: "user", content });

  // AI streaming bubble
  const textEl = appendMessage("assistant", "", true);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: conversationHistory,
        stream: true
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Erro ${res.status}: ${err}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";
    let buffer = "";

    textEl.innerHTML = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (raw === "[DONE]") continue;

        try {
          const json = JSON.parse(raw);
          const delta = json.choices?.[0]?.delta?.content || "";
          if (delta) {
            fullText += delta;
            textEl.innerHTML = formatContent(fullText);
            scrollToBottom(false);
          }
        } catch { /* skip bad chunks */ }
      }
    }

    // If stream didn't work (no content), try non-stream
    if (!fullText) {
      throw new Error("stream_empty");
    }

    conversationHistory.push({ role: "assistant", content: fullText });

  } catch (err) {
    // Fallback: non-stream request
    if (err.message === "stream_empty" || err.message.includes("stream")) {
      try {
        const res2 = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: conversationHistory
          })
        });
        const data = await res2.json();
        const reply = data.choices?.[0]?.message?.content || "Sem resposta.";
        textEl.innerHTML = formatContent(reply);
        conversationHistory.push({ role: "assistant", content: reply });
      } catch (e2) {
        textEl.innerHTML = `<p style="color:#f87171">⚠️ Erro: ${e2.message}</p>`;
        showToast("Falha na requisição");
        conversationHistory.pop();
      }
    } else {
      textEl.innerHTML = `<p style="color:#f87171">⚠️ ${err.message}</p>`;
      showToast("Erro ao conectar com a API");
      conversationHistory.pop();
    }
  } finally {
    isLoading = false;
    toggleSendBtn();
    scrollToBottom();
  }
}
</script>
